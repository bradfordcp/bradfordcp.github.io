{{ define "main" }}
  <article class="tui-doc">
    <header class="tui-doc-head">
      <h1>{{ .Title }}</h1>
      {{- with .Params.description }}
        <p class="tui-lead">{{ . }}</p>
      {{- end }}
      {{ partial "project-meta.html" . }}
    </header>
    <div class="tui-doc-body">
      {{ .Content }}
    </div>
  </article>
{{ end }}
