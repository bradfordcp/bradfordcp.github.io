baseurl = "https://bradfordcp.io/" # Hostname (and path) to the root.
title = "Christopher Bradford - @bradfordcp" # Site title.
theme = "tui"
locale = "en-US"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
pagerSize = 10

[services]
[services.disqus]

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params] # theme parameters
author = "Christopher Bradford"
description = "Christopher Bradford's projects & posts"
keywords = "blog,developer,project manager,personal,coding"
info = ["Product Manager", "Software Engineer", "Hacker"]
avatarURL = "images/avatar.jpg"
gravatar = "bradfordcp@gmail.com"
dateFormat = "2006-01-02"
since = 2019
fontAwesome = false
# Right To Left, shift content direction for languages such as Arabic
rtl = false

# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"
# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = false
# Series see also post count
maxSeeAlsoItems = 5
# Custom CSS
customCSS = []
customSCSS = []

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/bradfordcp/"
path = "/bradfordcp/"

[[params.social]]
name = "Twitter"
icon = "fa-brands fa-x-twitter fa-2x"
weight = 3
url = "https://twitter.com/bradfordcp/"
path = "/bradfordcp/"

[[params.social]]
name = "LinkedIn"
icon = "fa-brands fa-linkedin fa-2x"
weight = 4
url = "https://www.linkedin.com/in/bradfordcp/"
path = "/in/bradfordcp/"

[[params.social]]
name = "RSS"
icon = "fa-solid fa-rss fa-2x"
weight = 6
url = "https://bradfordcp.io/index.xml"
rel = "alternate"
type = "application/rss+xml"

